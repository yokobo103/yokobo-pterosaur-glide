<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23bfd0e0'/%3E%3Cpath d='M4 19 L16 8 L28 19 L16 15 Z' fill='%234a5568'/%3E%3C/svg%3E" />
<title>翼竜グライダー</title>
<meta name="description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta property="og:title" content="翼竜グライダー" />
<meta property="og:description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://yokobo103.github.io/yokobo-pterosaur-glide/" />
<meta property="og:image" content="https://yokobo103.github.io/yokobo-pterosaur-glide/ogp.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="翼竜グライダー" />
<meta property="og:locale" content="ja_JP" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="翼竜グライダー" />
<meta name="twitter:description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta name="twitter:image" content="https://yokobo103.github.io/yokobo-pterosaur-glide/ogp.jpg" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0e13; font-family:system-ui,sans-serif; }
  /* 押しっぱなしで操作するので、文字の選択と長押しメニューを出さない(スマホで「コピー/選択部分を検索」が出ていた) */
  html,body,#app,#hud,#msg,#start,canvas { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #nameIn { -webkit-user-select:text; user-select:text; }   /* 名前だけは打てるように */
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; padding:env(safe-area-inset-top) 16px 16px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; padding-top:14px; }
  .stat { font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .stat b { display:block; font-size:30px; line-height:1.05; font-weight:650; }
  .stat span { font-size:11px; opacity:.75; letter-spacing:.09em; }
  .right { text-align:right; }
  /* 上昇率の帯。音を切っていても芯が分かるようにする */
  #vario { position:fixed; right:14px; top:50%; transform:translateY(-50%); width:9px; height:190px;
           border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden; }
  #varioFill { position:absolute; left:0; right:0; top:50%; height:0; background:#7fe08a; transition:none; }
  #varioZero { position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.55); }
  /* 走行の終わり。背景に埋もれて読めなかったので、1枚の板にまとめる */
  #msg { z-index:2; position:fixed; inset:0; display:grid; place-items:center; color:#fff; pointer-events:none; padding:16px; }
  #msg .panel { pointer-events:auto; width:min(92vw,26rem); max-height:86vh; overflow-y:auto; text-align:center;
                background:rgba(8,11,16,.8); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px 16px; }
  #msg b { font-size:26px; display:block; }
  #msg span { font-size:13px; opacity:.8; }
  /* タイトル。後ろでは本物の世界が飛んでいるので、板で覆わず上下のぼかしだけで文字を読ませる */
  #start { z-index:2; position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between;
           text-align:center; color:#fff; padding:calc(env(safe-area-inset-top) + 9vh) 22px calc(env(safe-area-inset-bottom) + 7vh);
           background:linear-gradient(180deg,rgba(5,8,13,.55) 0%,rgba(5,8,13,.16) 24%,rgba(5,8,13,0) 42%,
                                              rgba(5,8,13,.22) 70%,rgba(5,8,13,.62) 100%); }
  #start h1 { font-size:clamp(30px,10vw,44px); font-weight:800; letter-spacing:.06em; line-height:1.15;
              text-shadow:0 2px 18px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.9); }
  /* 題の下の細い線。中央が明るく、両端へ消える */
  #start h1::after { content:""; display:block; height:2px; margin:14px auto 0; width:min(78%,19rem); border-radius:2px;
                     background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent); }
  #tagline { margin-top:14px; font-size:clamp(13px,3.6vw,16px); letter-spacing:.14em; opacity:.92;
             text-shadow:0 1px 8px rgba(0,0,0,.8); }
  #go { display:flex; align-items:center; justify-content:center; gap:12px; margin:0 auto;
        padding:16px 46px; font-size:17px; border:0; border-radius:999px; background:#eef3f9; color:#10151d;
        font-weight:700; letter-spacing:.06em; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  #go svg { width:15px; height:15px; }
  /* 遊び方・設定。押せると分かる丸い枠つき */
  #subBtns { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:22px; }
  #subBtns button { display:flex; align-items:center; gap:8px; padding:8px 6px; border:0; background:none;
                    color:#e8eef7; font-size:13px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #subBtns em { font-style:normal; }
  #subBtns span { display:grid; place-items:center; width:31px; height:31px; border-radius:50%; flex:none;
                  border:1px solid rgba(255,255,255,.5); }
  #subBtns svg { width:17px; height:17px; }
  #subBtns i { width:1px; height:26px; background:rgba(255,255,255,.3); }
  /* 遊び方・設定の中身 */
  .sheet { z-index:10; position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,6,10,.72); color:#fff; }
  .sheet .panel { width:min(94vw,27rem); max-height:88vh; overflow-y:auto; text-align:center;
                  background:rgba(8,11,16,.94); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:18px 16px; }
  .sheet h2 { font-size:15px; font-weight:650; margin-bottom:12px; }
  .sheet p { font-size:13px; line-height:1.85; opacity:.85; }
  .sheet kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:1px 7px; font-size:12px; }
  .sheet .label { font-size:11px; letter-spacing:.18em; opacity:.55; margin:4px 0 8px; }
  .sheet .note { font-size:11px; opacity:.6; margin-top:10px; line-height:1.7; }
  .sheet .close { margin-top:18px; padding:11px 30px; font-size:14px; border:0; border-radius:999px;
                  background:rgba(255,255,255,.14); color:#e8eef7; font-weight:650; }
  /* ずかん。出会っていないものは番号だけ出して ??? にする */
  #dexList { list-style:none; text-align:left; }
  #dexList li { display:flex; gap:10px; align-items:flex-start; padding:9px 2px; border-top:1px solid rgba(255,255,255,.1); }
  #dexList li i { flex:none; font-style:normal; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums;
                  width:2.1em; padding:3px 0; text-align:center; border-radius:6px;
                  background:rgba(255,255,255,.1); color:#cbd5e1; }
  #dexList li b { font-size:14px; font-weight:650; }
  #dexList li u { text-decoration:none; font-size:11px; opacity:.55; margin-left:7px; }
  #dexList li p { font-size:11px; line-height:1.65; opacity:.72; margin-top:2px; }
  #dexList li.seen i { background:rgba(127,224,138,.22); color:#bdf0c6; }
  #dexList li.unseen b { opacity:.45; letter-spacing:.12em; }
  #dexList li.unseen p { opacity:.35; }
  /* ずかんは長くなるので、閉じるを下に貼り付けておく(下まで送らないと閉じられないのを防ぐ) */
  #dex .close { position:sticky; bottom:-18px; z-index:1; display:block; width:100%; margin:14px 0 0;
                background:#222a35; box-shadow:0 -6px 0 6px rgba(8,11,16,.97), 0 -18px 18px 10px rgba(8,11,16,.8); }
  #cams { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #cams button { padding:11px 16px; font-size:13px; font-weight:600; border-radius:999px;
                 background:rgba(255,255,255,.1); color:#e8eef7; border:1px solid rgba(255,255,255,.22); }
  /* 選んでいるものは塗らずに枠と印で示す */
  #cams button[aria-checked="true"] { background:rgba(127,224,138,.16); color:#fff; border-color:#7fe08a; }
  #cams button[aria-checked="true"]::before { content:"✓ "; color:#7fe08a; }
  /* 発見の知らせ。飛行を止めず、視界の邪魔をしない大きさで出して消える */
  #found { z-index:3; position:fixed; left:0; right:0; top:22%; text-align:center; pointer-events:none;
           opacity:0; transition:opacity .45s ease; }
  #found.show { opacity:1; }
  #found span { display:block; font-size:11px; letter-spacing:.34em; color:#ffd79a; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  #found b { display:block; font-size:19px; font-weight:650; color:#fff; margin-top:3px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  /* 走行の終わりに、今回見つけたものだけ並べる */
  #foundList { margin:14px auto 0; max-width:22rem; text-align:left; }
  #foundList .item { display:flex; gap:8px; align-items:baseline; padding:5px 0; border-top:1px solid rgba(255,255,255,.14); }
  #foundList .item b { font-size:14px; font-weight:600; }
  #foundList .item i { font-size:11px; opacity:.6; font-style:normal; }
  #foundList .item em { font-size:11px; color:#ffd79a; font-style:normal; }
  #foundList p { font-size:11px; opacity:.72; margin:2px 0 0; line-height:1.6; }
  #foundList .none { font-size:12px; opacity:.6; }
  /* 走行の終わりのボタン */
  #endBtns { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  #endBtns button { padding:10px 18px; font-size:14px; border:0; border-radius:999px; font-weight:650;
                    background:rgba(255,255,255,.14); color:#e8eef7; pointer-events:auto; }
  #endBtns button.main { background:#e8eef7; color:#10151d; }
  /* ランキング。個人と世界をタブで切り替える */
  #rank { z-index:10; position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,6,10,.72); color:#fff; }
  #rank .panel { width:min(94vw,28rem); max-height:88vh; overflow-y:auto;
                 background:rgba(8,11,16,.94); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; }
  #rank h2 { font-size:15px; font-weight:650; margin-bottom:10px; text-align:center; }
  #rankTabs { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  #rankTabs button { flex:1; padding:9px 0; font-size:13px; font-weight:600; border-radius:999px;
                     border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#e8eef7; }
  #rankTabs button[aria-selected="true"] { background:rgba(127,224,138,.16); border-color:#7fe08a; color:#fff; }
  #rankList { list-style:none; }
  #rankList li { display:flex; gap:8px; align-items:center; padding:7px 6px; border-top:1px solid rgba(255,255,255,.1);
                 font-size:14px; border-radius:8px; }
  #rankList li i { font-style:normal; opacity:.5; flex:none; width:1.9em; height:1.9em; display:grid; place-items:center;
                   border-radius:50%; font-variant-numeric:tabular-nums; }
  #rankList li b { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #rankList li u { text-decoration:none; font-size:11px; opacity:.55; }
  #rankList li span { font-variant-numeric:tabular-nums; }
  /* 上の3つは金・銀・銅。1位だけ行も光らせる */
  #rankList li.top i { opacity:1; color:#10151d; font-weight:700; }
  #rankList li.top1 i { background:#e8c46a; box-shadow:0 0 12px rgba(232,196,106,.5); }
  #rankList li.top2 i { background:#c9d3dd; }
  #rankList li.top3 i { background:#d09a6a; }
  #rankList li.top1 { background:linear-gradient(90deg,rgba(232,196,106,.18),rgba(232,196,106,0) 65%); }
  #rankList li.top1 b { font-size:16px; font-weight:700; }
  #rankList li.top1 span { font-size:15px; font-weight:650; color:#f2dda8; }
  /* 今回の走行の行 */
  #rankList li.me { box-shadow:inset 2px 0 0 #7fe08a; }
  #rankList li.me em { font-style:normal; font-size:10px; font-weight:650; color:#10151d;
                       background:#7fe08a; border-radius:999px; padding:1px 7px; }
  #rankList .none { justify-content:center; opacity:.6; font-size:13px; padding:14px 0; }
  #rankName { display:flex; gap:8px; margin-top:12px; }
  #rankName input { flex:1; padding:10px 12px; font-size:15px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
                    background:rgba(255,255,255,.08); color:#fff; -webkit-user-select:text; user-select:text; }
  #rankName button { padding:10px 14px; font-size:13px; border:0; border-radius:10px; background:#e8eef7; color:#10151d;
                      font-weight:650; white-space:nowrap; flex:none; }
  #rankFoot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:11px; opacity:.6; }
  #rankFoot button { padding:9px 18px; font-size:13px; border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#e8eef7; font-weight:650; opacity:1; }
  /* 言語の切り替え(スタート画面の隅) */
  /* 言語の切り替えは常に一番上。下に敷くと板に覆われて指が当たらない(所長「英語押せない?」) */
  #lang { z-index:30; position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; display:flex; gap:6px; }
  #lang button { padding:6px 12px; font-size:12px; font-weight:600; border-radius:999px;
                 border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#e8eef7; }
  #lang button[aria-pressed="true"] { background:rgba(255,255,255,.9); color:#10151d; }
  /* はじめる前は数字を出さない(言語の切り替えと重なって読みにくかった) */
  #hud.pre, #vario.pre { opacity:0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud" class="pre">
    <div class="row">
      <div class="stat"><b id="dist">0.00</b><span>キョリ km</span></div>
      <div class="stat right"><b id="alt">0</b><span>タカサ m</span></div>
    </div>
  </div>
  <div id="vario" class="pre"><div id="varioFill"></div><div id="varioZero"></div></div>
  <div id="found" class="hidden"><span id="foundKind">DISCOVERED</span><b id="foundName"></b></div>
  <div id="msg" class="hidden"><div class="panel">
    <b id="msgTitle"></b><span id="msgSub"></span><div id="foundList"></div>
    <div id="endBtns"><button id="againBtn" class="main" type="button">もう一度</button>
      <button id="rankBtn" type="button">ランキング</button></div></div></div>
  <div id="rank" class="hidden"><div class="panel">
    <h2 id="rankHead">この端末の記録</h2>
    <div id="rankTabs" role="tablist">
      <button id="tabMine" type="button" role="tab" aria-selected="true">この端末</button>
      <button id="tabWorld" type="button" role="tab" aria-selected="false">世界</button>
    </div>
    <ol id="rankList"></ol>
    <div id="rankName" class="hidden"><input id="nameIn" type="text" maxlength="12" placeholder="なまえ" enterkeyhint="done" />
      <button id="nameGo" type="button">記録する</button></div>
    <div id="rankFoot"><span id="seasonTag"></span><button id="rankClose" type="button">閉じる</button></div>
  </div></div>
  <div id="lang" class="hidden"><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button></div>
  <div id="start">
    <div>
      <h1 id="title">翼竜グライダー</h1>
      <p id="tagline"></p>
    </div>
    <div>
      <button id="go" type="button"><span id="goLabel">はじめる</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <div id="subBtns">
        <button id="dexBtn" type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4.5h10a2.5 2.5 0 012.5 2.5v12.5H6.5A2.5 2.5 0 014 17V4.5zM20 7.5v12"/><path d="M7.5 9h5.5M7.5 12.5h5.5"/>
          </svg></span><em id="dexLabel">ずかん</em></button>
        <i></i>
        <button id="howtoBtn" type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5.5h6a3 3 0 013 3v10a2.5 2.5 0 00-2.5-2.5H3zM21 5.5h-6a3 3 0 00-3 3v10a2.5 2.5 0 012.5-2.5H21z"/>
          </svg></span><em id="howtoLabel">遊び方</em></button>
        <i></i>
        <button id="setBtn" type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2L5.4 5.4"/>
          </svg></span><em id="setLabel">設定</em></button>
      </div>
    </div>
  </div>
  <div id="howto" class="sheet hidden"><div class="panel">
    <h2 id="howtoTitle">遊び方</h2><p id="intro"></p>
    <button id="howtoClose" class="close" type="button">閉じる</button>
  </div></div>
  <div id="dex" class="sheet hidden"><div class="panel">
    <h2 id="dexTitle">ずかん</h2>
    <p class="label" id="dexCount"></p>
    <ol id="dexList"></ol>
    <button id="dexClose" class="close" type="button">閉じる</button>
  </div></div>
  <div id="settings" class="sheet hidden"><div class="panel">
    <h2 id="setTitle">設定</h2>
    <p class="label" id="camLabel">カメラ</p>
    <div id="cams" role="radiogroup">
      <button type="button" data-cam="a" role="radio"></button>
      <button type="button" data-cam="c" role="radio"></button>
      <button type="button" data-cam="b" role="radio"></button>
    </div>
    <p class="note" id="camNote"></p>
    <button id="setClose" class="close" type="button">閉じる</button>
  </div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
