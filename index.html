<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23bfd0e0'/%3E%3Cpath d='M4 19 L16 8 L28 19 L16 15 Z' fill='%234a5568'/%3E%3C/svg%3E" />
<title>翼竜グライダー</title>
<meta name="description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta property="og:title" content="翼竜グライダー" />
<meta property="og:description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://yokobo103.github.io/yokobo-pterosaur-glide/" />
<meta property="og:image" content="https://yokobo103.github.io/yokobo-pterosaur-glide/ogp.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="翼竜グライダー" />
<meta property="og:locale" content="ja_JP" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="翼竜グライダー" />
<meta name="twitter:description" content="上昇気流を読んで、どこまで行けるか。翼竜になって中生代の空を滑空する。操作は左右だけ。" />
<meta name="twitter:image" content="https://yokobo103.github.io/yokobo-pterosaur-glide/ogp.jpg" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0e13; font-family:system-ui,sans-serif; }
  /* 押しっぱなしで操作するので、文字の選択と長押しメニューを出さない(スマホで「コピー/選択部分を検索」が出ていた) */
  html,body,#app,#hud,#msg,#start,canvas { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #nameIn { -webkit-user-select:text; user-select:text; }   /* 名前だけは打てるように */
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; padding:env(safe-area-inset-top) 16px 16px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; padding-top:14px; }
  .stat { font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .stat b { display:block; font-size:30px; line-height:1.05; font-weight:650; }
  .stat span { font-size:11px; opacity:.75; letter-spacing:.09em; }
  .right { text-align:right; }
  /* 上昇率の帯。音を切っていても芯が分かるようにする */
  #vario { position:fixed; right:14px; top:50%; transform:translateY(-50%); width:9px; height:190px;
           border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden; }
  #varioFill { position:absolute; left:0; right:0; top:50%; height:0; background:#7fe08a; transition:none; }
  #varioZero { position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.55); }
  /* 走行の終わり。背景に埋もれて読めなかったので、1枚の板にまとめる */
  #msg { position:fixed; inset:0; display:grid; place-items:center; color:#fff; pointer-events:none; padding:16px; }
  #msg .panel { pointer-events:auto; width:min(92vw,26rem); max-height:86vh; overflow-y:auto; text-align:center;
                background:rgba(8,11,16,.8); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px 16px; }
  #msg b { font-size:26px; display:block; }
  #msg span { font-size:13px; opacity:.8; }
  #start { position:fixed; inset:0; display:grid; place-content:center; gap:14px; text-align:center;
           background:rgba(6,9,14,.9); color:#fff; padding:24px; }
  #start h1 { font-size:20px; font-weight:650; letter-spacing:.02em; }
  #start p { font-size:13px; line-height:1.85; opacity:.82; max-width:30rem; }
  #start kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:1px 7px; font-size:12px; }
  #start button { margin:6px auto 0; padding:13px 40px; font-size:15px; border:0; border-radius:999px;
                  background:#e8eef7; color:#10151d; font-weight:650; }
  #cams { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #start #cams button { margin:0; padding:10px 16px; font-size:13px; font-weight:600;
                        background:rgba(255,255,255,.1); color:#e8eef7; border:1px solid rgba(255,255,255,.22); }
  /* 選択中は「はじめる」と見分けがつくよう、塗らずに枠と印で示す */
  #start #cams button[aria-checked="true"] { background:rgba(127,224,138,.16); color:#fff; border-color:#7fe08a; }
  #start #cams button[aria-checked="true"]::before { content:"✓ "; color:#7fe08a; }
  #start p.note { font-size:11px; opacity:.6; margin-top:-6px; }
  /* 発見の知らせ。飛行を止めず、視界の邪魔をしない大きさで出して消える */
  #found { position:fixed; left:0; right:0; top:22%; text-align:center; pointer-events:none;
           opacity:0; transition:opacity .45s ease; }
  #found.show { opacity:1; }
  #found span { display:block; font-size:11px; letter-spacing:.34em; color:#ffd79a; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  #found b { display:block; font-size:19px; font-weight:650; color:#fff; margin-top:3px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  /* 走行の終わりに、今回見つけたものだけ並べる */
  #foundList { margin:14px auto 0; max-width:22rem; text-align:left; }
  #foundList .item { display:flex; gap:8px; align-items:baseline; padding:5px 0; border-top:1px solid rgba(255,255,255,.14); }
  #foundList .item b { font-size:14px; font-weight:600; }
  #foundList .item i { font-size:11px; opacity:.6; font-style:normal; }
  #foundList .item em { font-size:11px; color:#ffd79a; font-style:normal; }
  #foundList p { font-size:11px; opacity:.72; margin:2px 0 0; line-height:1.6; }
  #foundList .none { font-size:12px; opacity:.6; }
  /* 走行の終わりのボタン */
  #endBtns { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  #endBtns button { padding:10px 18px; font-size:14px; border:0; border-radius:999px; font-weight:650;
                    background:rgba(255,255,255,.14); color:#e8eef7; pointer-events:auto; }
  #endBtns button.main { background:#e8eef7; color:#10151d; }
  /* ランキング。個人と世界をタブで切り替える */
  #rank { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:rgba(4,6,10,.72); color:#fff; }
  #rank .panel { width:min(94vw,28rem); max-height:88vh; overflow-y:auto;
                 background:rgba(8,11,16,.94); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; }
  #rank h2 { font-size:15px; font-weight:650; margin-bottom:10px; text-align:center; }
  #rankTabs { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  #rankTabs button { flex:1; padding:9px 0; font-size:13px; font-weight:600; border-radius:999px;
                     border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#e8eef7; }
  #rankTabs button[aria-selected="true"] { background:rgba(127,224,138,.16); border-color:#7fe08a; color:#fff; }
  #rankList { list-style:none; }
  #rankList li { display:flex; gap:8px; align-items:baseline; padding:7px 2px; border-top:1px solid rgba(255,255,255,.1); font-size:14px; }
  #rankList li i { font-style:normal; opacity:.5; width:2.2em; text-align:right; font-variant-numeric:tabular-nums; }
  #rankList li b { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #rankList li u { text-decoration:none; font-size:11px; opacity:.55; }
  #rankList li span { font-variant-numeric:tabular-nums; }
  #rankList li.me { color:#ffd79a; }
  #rankList .none { justify-content:center; opacity:.6; font-size:13px; }
  #rankName { display:flex; gap:8px; margin-top:12px; }
  #rankName input { flex:1; padding:10px 12px; font-size:15px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
                    background:rgba(255,255,255,.08); color:#fff; -webkit-user-select:text; user-select:text; }
  #rankName button { padding:10px 16px; font-size:13px; border:0; border-radius:10px; background:#e8eef7; color:#10151d; font-weight:650; }
  #rankFoot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:11px; opacity:.6; }
  #rankFoot button { padding:9px 18px; font-size:13px; border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#e8eef7; font-weight:650; opacity:1; }
  /* 言語の切り替え(スタート画面の隅) */
  #lang { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; display:flex; gap:6px; }
  #lang button { padding:6px 12px; font-size:12px; font-weight:600; border-radius:999px;
                 border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#e8eef7; }
  #lang button[aria-pressed="true"] { background:rgba(255,255,255,.9); color:#10151d; }
  /* はじめる前は数字を出さない(言語の切り替えと重なって読みにくかった) */
  #hud.pre, #vario.pre { opacity:0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud" class="pre">
    <div class="row">
      <div class="stat"><b id="dist">0.00</b><span>キョリ km</span></div>
      <div class="stat right"><b id="alt">0</b><span>タカサ m</span></div>
    </div>
  </div>
  <div id="vario" class="pre"><div id="varioFill"></div><div id="varioZero"></div></div>
  <div id="found" class="hidden"><span id="foundKind">DISCOVERED</span><b id="foundName"></b></div>
  <div id="msg" class="hidden"><div class="panel">
    <b id="msgTitle"></b><span id="msgSub"></span><div id="foundList"></div>
    <div id="endBtns"><button id="againBtn" class="main" type="button">もう一度</button>
      <button id="rankBtn" type="button">ランキング</button></div></div></div>
  <div id="rank" class="hidden"><div class="panel">
    <h2 id="rankHead">この端末の記録</h2>
    <div id="rankTabs" role="tablist">
      <button id="tabMine" type="button" role="tab" aria-selected="true">この端末</button>
      <button id="tabWorld" type="button" role="tab" aria-selected="false">世界</button>
    </div>
    <ol id="rankList"></ol>
    <div id="rankName" class="hidden"><input id="nameIn" type="text" maxlength="12" placeholder="なまえ" enterkeyhint="done" />
      <button id="nameGo" type="button">記録する</button></div>
    <div id="rankFoot"><span id="seasonTag"></span><button id="rankClose" type="button">閉じる</button></div>
  </div></div>
  <div id="lang" class="hidden"><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button></div>
  <div id="start">
    <h1>翼竜グライダー</h1>
    <p id="intro"></p>
    <div id="cams" role="radiogroup" aria-label="カメラ">
      <button type="button" data-cam="a" role="radio"></button>
      <button type="button" data-cam="c" role="radio"></button>
      <button type="button" data-cam="b" role="radio"></button>
    </div>
    <p class="note">画面酔いしやすい人は「水平キープ」か「見下ろし」</p>
    <button id="go">はじめる</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
